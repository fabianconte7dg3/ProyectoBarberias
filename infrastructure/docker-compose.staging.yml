# Copia de docker-compose.production.yml para un entorno de staging
# separado. Sin datos reales — placeholder listo para cuando exista un
# servidor de staging real (ver docs/02-arquitectura-y-db/
# Plan_Fase4_Infraestructura.md, seccion "Fuera de esta pasada").
#
# Nombre de proyecto y container_name con prefijo `_staging` explicito
# por la misma razon que produccion usa `_prod`: un container_name es
# global, no se scopea por proyecto — necesario para poder correr dev +
# staging + produccion en la misma maquina sin colisiones.
name: volumetrix-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: volumetrix_staging_postgres
    restart: unless-stopped
    environment:
      # Mismo modelo que docker-compose.production.yml: POSTGRES_USER es el
      # owner/superusuario (solo para migraciones a mano), `app_user`
      # (no-superusuario, NOBYPASSRLS) es el unico rol que usa la app — ver
      # postgres-init-production/ (reutilizado tal cual, es generico por env vars).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-volumetrix}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init-production:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: volumetrix_staging_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    container_name: volumetrix_staging_api
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../apps/web
      args:
        # Ruteo por path, no por subdominio: `${APP_DOMAIN}/api/*` -> api,
        # el resto -> web (ver infrastructure/staging/Caddyfile). Evita
        # depender de un segundo hostname DNS (`api.<dominio>`) que algunos
        # proveedores de DNS dinamico gratuito no dejan crear junto con un
        # wildcard. `APP_DOMAIN` viene de .env.staging, resuelto por
        # `docker compose --env-file .env.staging build` (no del env_file
        # de runtime del container, que no aplica a build args).
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api
        NEXT_PUBLIC_ROOT_HOST: ${APP_DOMAIN}
    container_name: volumetrix_staging_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 explicito + header Host manual, no "localhost": `localhost`
      # resuelve a ::1 antes que a 127.0.0.1 en /etc/hosts, wget de busybox no
      # cae a IPv4 si la conexion IPv6 es rechazada (Next.js standalone solo
      # bindea IPv4, ver ENV HOSTNAME en apps/web/Dockerfile) -- el healthcheck
      # nunca conectaba. El header Host explicito hace falta ademas porque
      # proxy.ts interpreta el host de la request como slug de tenant salvo
      # que sea exactamente "localhost" (ROOT_HOSTS) -- sin el header, pegarle
      # a 127.0.0.1 devuelve 404 (lo interpreta como slug "127"). Encontrado
      # desplegando de verdad por primera vez (ver Plan_Fase4_Infraestructura.md).
      test: ["CMD-SHELL", "wget -qO- --header='Host: localhost' http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: volumetrix_staging_caddy
    restart: unless-stopped
    env_file:
      - .env.staging
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
    name: volumetrix_staging_postgres_data
  redis_data:
    name: volumetrix_staging_redis_data
  caddy_data:
    name: volumetrix_staging_caddy_data
  caddy_config:
    name: volumetrix_staging_caddy_config
